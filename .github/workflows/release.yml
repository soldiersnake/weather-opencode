name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ej. 1.2.3). Si se omite, se usa la de package.json'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test

      - name: Read version from package.json
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version changed
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"

          PREV=$(git show "HEAD~1:package.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version || ''" 2>/dev/null || echo "")

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "El tag $TAG ya existe. Nada que hacer."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Ejecucion manual; se publicara $TAG."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$PREV" ]; then
            echo "No hay version anterior; se publicara $TAG."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [ "$PREV" != "$VERSION" ]; then
            echo "Version cambio: $PREV -> $VERSION; se publicara $TAG."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "La version ($VERSION) no cambio respecto al commit anterior. Nada que hacer."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binaries
        if: steps.check.outputs.should_release == 'true'
        run: |
          mkdir -p dist
          TARGET=bun-linux-x64    OUTFILE=dist/weather-linux-x64       bun run build
          TARGET=bun-darwin-arm64 OUTFILE=dist/weather-darwin-arm64    bun run build
          TARGET=bun-windows-x64  OUTFILE=dist/weather-windows-x64.exe bun run build
          ls -la dist

      - name: Create tag and release
        if: steps.check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
